apiVersion: v1
kind: Pod
metadata:
  name: kubever-pod
  labels:
    app: kubever
spec:
  containers:
  - name: kubever-container
    image: localhost/kubever:latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: kubever-service
spec:
  type: NodePort
  selector:
    app: kubever
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080 # pod listening port
    nodePort: 30000  # targeting Kind cluster
